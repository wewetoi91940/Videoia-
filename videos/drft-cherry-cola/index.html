        font-weight: 400;
      }
      @font-face {
        font-family: "Oswald";
        src: url("assets/fonts/Oswald-Bold.woff2") format("woff2");
        font-weight: 700;
      }

      :root {
        --black: #0a0a0b;
        --cherry: #8f102b;
        --red: #e52b47;
        --alu: #c6c2bd;
        --white: #f5f3f0;
        --wipe: #a3122f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--black);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--black);
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* 3D layer: can, liquid, drops, rings, cherries (Three.js, rendered from HyperFrames time) */
      #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* S2 -> S3: a red reflection crosses the lens and fills the frame */
      #sheen {
        overflow: hidden;
        pointer-events: none;
      }
      #sheen-band {
        position: absolute;
        top: -10%;
        left: 0;
        width: 4320px;
        height: 120%;
        background: linear-gradient(
          90deg,
          rgba(229, 43, 71, 0) 0%,
          rgba(229, 43, 71, 0.55) 8%,
          #e52b47 15%,
          #8f102b 34%,
          #b3162f 52%,
          #e52b47 60%,
          #8f102b 85%,
          rgba(143, 16, 43, 0.6) 92%,
          rgba(143, 16, 43, 0) 100%
        );
      }

      /* S5 -> S6: the red frame opens as an iris onto the packshot */
      #iris {
        --r: 0px;
        pointer-events: none;
        background: radial-gradient(
          circle at 540px 770px,
          rgba(229, 43, 71, 0) var(--r),
          #f05a70 calc(var(--r) + 1px),
          #e52b47 calc(var(--r) + 5px),
          var(--wipe) calc(var(--r) + 46px)
        );
        -webkit-mask-image: radial-gradient(circle at 540px 770px, transparent var(--r), #000 calc(var(--r) + 1.5px));
        mask-image: radial-gradient(circle at 540px 770px, transparent var(--r), #000 calc(var(--r) + 1.5px));
      }

      /* Packshot typography */
      #lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 1262px;
      }
      #cc {
        display: block;
        font-family: "League Gothic", sans-serif;
        font-weight: 400;
        font-size: 176px;
        line-height: 1;
        letter-spacing: 0.03em;
        color: var(--white);
        white-space: nowrap;
      }
      #cc .ch {
        display: inline-block;
      }
      #rule {
        display: block;
        width: 72px;
        height: 3px;
        margin: 30px 0 28px;
        background: var(--red);
        transform-origin: 50% 50%;
      }
      #slogan {
        display: block;
        font-family: "Oswald", sans-serif;
        font-weight: 400;
        font-size: 33px;
        letter-spacing: 0.46em;
        padding-left: 0.46em;
        color: var(--alu);
        white-space: nowrap;
      }

      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 78% 62% at 50% 46%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.62) 100%);
      }

      /* grain-overlay (registry component) — kept very low: it only dithers the dark gradients */
      @keyframes hf-grain-noise {
        0%,
        100% {
          transform: translate(0, 0);
        }
        10% {
          transform: translate(-5%, -5%);
        }
        20% {
          transform: translate(-10%, 5%);
        }
        30% {
          transform: translate(5%, -10%);
        }
        40% {
          transform: translate(-5%, 15%);
        }
        50% {
          transform: translate(-10%, 5%);
        }
        60% {
          transform: translate(15%, 0);
        }
        70% {
          transform: translate(0, 10%);
        }
        80% {
          transform: translate(-15%, 0);
        }
        90% {
          transform: translate(10%, 5%);
        }
      }
      #grain-overlay .grain-texture {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.045;
        animation: hf-grain-noise 0.5s steps(1) infinite;
      }
    </style>

    <script type="module">
      // ---- 3D layer: every visual state below is a pure function of HyperFrames time ----
      import * as THREE from "three";

      window.__hf = window.__hf || {};

      let pendingTime = 0;
      let lastTime = -1;
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));

      const W = 1080;
      const H = 1920;
      const PAL = { black: "#0A0A0B", cherry: "#8F102B", red: "#E52B47", alu: "#C6C2BD", white: "#F5F3F0", wipe: "#A3122F" };

      // Scene cuts (hidden under full-frame red): S3 starts under the sheen, S6 under the iris.

      const CUT_S6 = 8.5;

      // ---------- timing helpers ----------
      const EZ = {};
      const ez = (name) => EZ[name] || (EZ[name] = gsap.parseEase(name));
      const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
      const prog = (t, a, b) => clamp01((t - a) / (b - a));
      const lerp = (a, b, p) => a + (b - a) * p;
      const tw = (t, a, b, from, to, e = "none") => lerp(from, to, ez(e)(prog(t, a, b)));

        const p = clamp01((x - a) / (b - a));

      // Exact palette through Neutral tone mapping: Neutral subtracts a shadow offset, so dark
      // flat colours are pre-compensated to land on their hex value in the final frame.
      function invNeutral(hex) {
        const c = new THREE.Color(hex);
        const m = Math.min(c.r, c.g, c.b);
        const off = m < 0.04 ? Math.sqrt(m / 6.25) - m : 0.04;
        return new THREE.Color(c.r + off, c.g + off, c.b + off);

      // ---------- renderer ----------
      const canvas = document.getElementById("gl");

        panel(2.2, 11, PAL.red, 2.6, [10, 2.4, -5], [0, 2.4, 0]); // red rim, right-back (short: keeps the neck silver)

      // ---------- shared shader patch: analytic strip-light reflection + fresnel rim ----------
      const U = {
        uBandAz: { value: 0 },
        uBandW: { value: 0.1 },
        uBandCol: { value: new THREE.Color(PAL.red) },
        uBandStr: { value: 0 },
        uRimCol: { value: new THREE.Color(PAL.red) },
        uRimStr: { value: 0 },
      };
      function patch(mat, rimScale) {
        mat.onBeforeCompile = (sh) => {
          Object.assign(sh.uniforms, U);
          sh.uniforms.uRimScale = { value: rimScale };
          sh.fragmentShader = sh.fragmentShader
            .replace(
              "#include <common>",
              `#include <common>
uniform float uBandAz; uniform float uBandW; uniform vec3 uBandCol; uniform float uBandStr;
uniform vec3 uRimCol; uniform float uRimStr; uniform float uRimScale;`,
            )
            .replace(
              "#include <opaque_fragment>",
              `{
  vec3 vdirV = normalize( vViewPosition );
  vec3 rW = inverseTransformDirection( reflect( -vdirV, normal ), viewMatrix );
  float dAz = atan( rW.x, rW.z ) - uBandAz;
  dAz = atan( sin( dAz ), cos( dAz ) );
  float band = exp( -0.5 * dAz * dAz / ( uBandW * uBandW ) ) * exp( -1.4 * rW.y * rW.y );
  float ndv = clamp( dot( normal, vdirV ), 0.0, 1.0 );
  float rim = pow( 1.0 - ndv, 3.0 );
  outgoingLight += uBandCol * ( uBandStr * band ) + uRimCol * ( uRimStr * uRimScale * rim );
}
#include <opaque_fragment>`,
            );

        return mat;

      // ---------- label artwork (canvas → texture), drawn once the local fonts are loaded ----------
      const BODY_Y0 = 0.32;
      const BODY_Y1 = 4.2;
      const BODY_H = BODY_Y1 - BODY_Y0;
      const LW = 4096;
      const LH = Math.round((LW / (2 * Math.PI)) * BODY_H); // isotropic: 652 px per world unit
      const PXU = LH / BODY_H;
      const LY = (yw) => (BODY_Y1 - yw) * PXU;

      const HAIR_BOT = 1.68;

      function drawLabel() {
        const col = document.createElement("canvas");
        const mrm = document.createElement("canvas");
        col.width = mrm.width = LW;
        col.height = mrm.height = LH;
        const c = col.getContext("2d");
        const m = mrm.getContext("2d");
        // roughness → G, metalness → B (three.js channel convention)
        const MR = (rough, metal) => `rgb(0, ${Math.round(rough * 255)}, ${Math.round(metal * 255)})`;

        c.fillStyle = "#0b0b0d";
        c.fillRect(0, 0, LW, LH);
        m.fillStyle = MR(0.34, 0.25);
        m.fillRect(0, 0, LW, LH);

        // Candy-cherry liquid level: two waves around the can (they roll when it turns).
        const waveY = (x) => LY(1.05 + 0.1 * Math.sin((2 * Math.PI * 2 * x) / LW + 0.6));
        const wave = (ctx) => {
          ctx.beginPath();
          ctx.moveTo(0, LH);
          for (let x = 0; x <= LW; x += 8) ctx.lineTo(x, waveY(x));
          ctx.lineTo(LW, LH);
          ctx.closePath();
        };
        const g = c.createLinearGradient(0, LY(1.2), 0, LH);
        g.addColorStop(0, PAL.cherry);
        g.addColorStop(1, "#4a0614");
        wave(c);
        c.fillStyle = g;
        c.fill();
        wave(m);
        m.fillStyle = MR(0.24, 0.88);
        m.fill();
        c.beginPath();
        for (let x = 0; x <= LW; x += 8) (x ? c.lineTo : c.moveTo).call(c, x, waveY(x));
        c.strokeStyle = PAL.red;
        c.lineWidth = 7;
        c.stroke();

        for (const yw of [HAIR_TOP, HAIR_BOT]) {
          c.fillStyle = PAL.red;
          c.fillRect(0, LY(yw) - 4, LW, 8);
          m.fillStyle = MR(0.45, 0);
          m.fillRect(0, LY(yw) - 4, LW, 8);
        }

        // Text helper: same glyphs on both canvases, colour on one, material on the other.
        const text = (str, font, spacingEm, x, capCenterY, fill, mr, rotate = 0) => {
          for (const [ctx, style] of [
            [c, fill],
            [m, mr],
          ]) {
            ctx.save();
            ctx.font = font.css;
            ctx.letterSpacing = `${font.size * spacingEm}px`;
            ctx.textAlign = "center";
            ctx.textBaseline = "alphabetic";
            ctx.translate(x, capCenterY);
            if (rotate) ctx.rotate(rotate);
            ctx.fillStyle = style;
            ctx.fillText(str, (font.size * spacingEm) / 2, font.cap / 2);
            ctx.restore();
          }
        };
        const fontFor = (family, weight, capPx) => {
          c.font = `${weight} 1000px "${family}"`;
          const ratio = c.measureText("H").actualBoundingBoxAscent / 1000;
          const size = capPx / ratio;
          return { css: `${weight} ${size}px "${family}"`, size, cap: capPx };
        };

        // Logo DRFT — front centre (u = 0.5 faces the camera at rest).
        const logo = fontFor("League Gothic", 400, 0.98 * PXU);
        text("DRFT", logo, 0.035, LW / 2, LY(2.8), "#F2EEE8", MR(0.42, 0));
        const sub = fontFor("Oswald", 700, 0.115 * PXU);
        text("CHERRY COLA", sub, 0.42, LW / 2, LY(2.06), PAL.red, MR(0.45, 0));

        // Back of the can: vertical slogan + volume, visible while it spins.
        const back = fontFor("Oswald", 700, 0.1 * PXU);
        for (const x of [0, LW]) text("BREAK THE ORDINARY.", back, 0.3, x, LY(2.66), "#bdb9b4", MR(0.4, 0.6), -Math.PI / 2);
        const vol = fontFor("Oswald", 400, 0.07 * PXU);
        text("355 ML", vol, 0.3, LW * 0.25, LY(1.92), "#8d8a86", MR(0.4, 0.5));
        text("NO. 07", vol, 0.3, LW * 0.75, LY(1.92), "#8d8a86", MR(0.4, 0.5));

        const colTex = new THREE.CanvasTexture(col);
        colTex.colorSpace = THREE.SRGBColorSpace;
        const mrmTex = new THREE.CanvasTexture(mrm);
        mrmTex.colorSpace = THREE.NoColorSpace;
        for (const tx of [colTex, mrmTex]) {
          tx.wrapS = THREE.RepeatWrapping;
          tx.anisotropy = renderer.capabilities.getMaxAnisotropy();
        }
        return { colTex, mrmTex };
      }

      function radialTexture(stops, size = 512) {
        const cv = document.createElement("canvas");
        cv.width = cv.height = size;
        const ctx = cv.getContext("2d");
        const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        for (const [o, col] of stops) g.addColorStop(o, col);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
        const tex = new THREE.CanvasTexture(cv);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      // ---------- geometry helpers ----------
      function ringGeometry(tubular = 200, radial = 10) {
        const geo = new THREE.BufferGeometry();
        const n = (tubular + 1) * (radial + 1);
        geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
        geo.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
        const idx = [];
        for (let i = 0; i < tubular; i++)
          for (let j = 0; j < radial; j++) {
            const a = i * (radial + 1) + j;
            const b = (i + 1) * (radial + 1) + j;
            idx.push(a, b, a + 1, b, b + 1, a + 1);
          }
        geo.setIndex(idx);
        geo.userData = { tubular, radial };
        return geo;
      }
      // Ring of major radius R in the local XY plane (faces +Z), constant tube radius r.
      function setRing(geo, R, r) {
        const { tubular, radial } = geo.userData;
        const pos = geo.attributes.position.array;
        const nor = geo.attributes.normal.array;
        let k = 0;
        for (let i = 0; i <= tubular; i++) {
          const a = (i / tubular) * Math.PI * 2;
          const ca = Math.cos(a);
          const sa = Math.sin(a);
          for (let j = 0; j <= radial; j++) {
            const b = (j / radial) * Math.PI * 2;
            const nx = ca * Math.cos(b);
            const ny = sa * Math.cos(b);
            const nz = Math.sin(b);
            pos[k] = R * ca + r * nx;
            pos[k + 1] = R * sa + r * ny;
            pos[k + 2] = r * nz;
            nor[k] = nx;
            nor[k + 1] = ny;
            nor[k + 2] = nz;
            k += 3;

        geo.attributes.normal.needsUpdate = true;

      const bezier = (p0, p1, p2, p3, u) => {
        const v = 1 - u;

          .addScaledVector(p0, v * v * v)
          .addScaledVector(p1, 3 * v * v * u)
          .addScaledVector(p2, 3 * v * u * u)
          .addScaledVector(p3, u * u * u);
      };
      const V = (x, y, z) => new THREE.Vector3(x, y, z);

      // ---------- build ----------
      let canGroup, canInner, labelMesh, frags, lines, liquid, drops, rings, cherries, cherryFG, disc, glowPlane, drip, ripples, rebound;
      let matLabel, matShell, matAlu, YS;
      const clipPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 50);

      async function build() {
        await Promise.all([
          document.fonts.load('400 200px "League Gothic"'),
          document.fonts.load('700 100px "Oswald"'),

        scene.environment = buildEnvironment();
        const { colTex, mrmTex } = drawLabel();

        // Background glow: a cherry bloom far behind the can (parallaxes with the camera).
        glowPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(18, 18),
          new THREE.MeshBasicMaterial({
            map: radialTexture([
              [0, "rgba(143,16,43,1)"],
              [0.35, "rgba(143,16,43,0.45)"],
              [1, "rgba(143,16,43,0)"],
            ]),

        matLabel = patch(
          new THREE.MeshPhysicalMaterial({

            roughness: 1,
            metalness: 1,
            clearcoat: 1,
            clearcoatRoughness: 0.07,
            emissive: 0xffffff,

        canGroup = new THREE.Group();

        canGroup.add(canInner);

        labelMesh = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, BODY_H, 192, 1, true), matLabel);
        labelMesh.position.y = BODY_Y0 + BODY_H / 2;

            [0.955, 4.43],
            [0.915, 4.52],
            [0.875, 4.6],
            [0.85, 4.66],
            [0.842, 4.71],
            [0.842, 4.745],
            [0.852, 4.765],
            [0.862, 4.79],
            [0.864, 4.815],
            [0.855, 4.835],
            [0.84, 4.842],
            [0.825, 4.832],
            [0.81, 4.8],
            [0.8, 4.768],
            [0.79, 4.772],
            [0.76, 4.785],
            [0.0, 4.785],
          ],
          matAlu,
        );
        const base = lathe(
          [
            [0.0, 0.1],
            [0.45, 0.07],
            [0.7, 0.02],
            [0.78, 0.0],
            [0.83, 0.006],
            [0.88, 0.03],
            [0.93, 0.08],
            [0.97, 0.15],
            [0.993, 0.24],
            [1.0, 0.32],

          matAlu,

        // Pull tab + opening score on the lid (they turn with the can).
        const tabShape = new THREE.Shape();
        const rr = (s, x0, y0, x1, y1, r) => {
          s.moveTo(x0 + r, y0);
          s.lineTo(x1 - r, y0);
          s.quadraticCurveTo(x1, y0, x1, y0 + r);
          s.lineTo(x1, y1 - r);
          s.quadraticCurveTo(x1, y1, x1 - r, y1);
          s.lineTo(x0 + r, y1);
          s.quadraticCurveTo(x0, y1, x0, y1 - r);
          s.lineTo(x0, y0 + r);
          s.quadraticCurveTo(x0, y0, x0 + r, y0);
        };
        rr(tabShape, -0.15, -0.17, 0.15, 0.47, 0.12);
        const hole = new THREE.Path();
        rr(hole, -0.085, 0.19, 0.085, 0.38, 0.07);
        tabShape.holes.push(hole);
        const tab = new THREE.Mesh(
          new THREE.ExtrudeGeometry(tabShape, {
            depth: 0.014,
            bevelEnabled: true,
            bevelThickness: 0.005,
            bevelSize: 0.006,
            bevelSegments: 2,
            curveSegments: 18,
          }),
          matAlu,
        );
        tab.rotation.x = -Math.PI / 2; // shape +Y → world −Z: finger ring to the back, nose to the front
        tab.position.y = 4.792;
        const rivet = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.03, 24), matAlu);
        rivet.position.y = 4.8;
        const scoreShape = new THREE.Shape();
        scoreShape.absellipse(0, -0.36, 0.2, 0.25, 0, Math.PI * 2, false, 0);
        const score = new THREE.Mesh(new THREE.ShapeGeometry(scoreShape, 40), matScore);
        score.rotation.x = -Math.PI / 2;
        score.position.y = 4.7865;

        // Fragments: the raw aluminium shell split into 7 cylindrical rings + top + base.
        frags = [];
        const BAND_H = BODY_H / 7;
        const ORDER = [3, 2, 1, 0, 1, 2, 3];
        const SIDE = [-1, 1, -1, 1, 1, -1, 1];
        for (let k = 0; k < 7; k++) {
          const yk = BODY_Y0 + (k + 0.5) * BAND_H;
          const pivot = new THREE.Group();
          pivot.add(new THREE.Mesh(new THREE.CylinderGeometry(1.004, 1.004, BAND_H, 192, 1, true), matShell));
          canInner.add(pivot);
          frags.push({
            pivot,
            y: yk,
            order: ORDER[k],
            side: SIDE[k],
            start: { x: SIDE[k] * (6.2 + 0.5 * ORDER[k]), y: yk + (k - 3) * 0.18, z: k % 2 ? -1.4 : 1.1, rx: k % 2 ? 0.4 : -0.35, rz: SIDE[k] * 0.6 },
            hover: { x: SIDE[k] * 0.34, y: yk, z: 0, rx: 0, rz: SIDE[k] * 0.04 },
            driftX: SIDE[k] * 0.29,
            driftY: yk,
          });
        }
        const topPivot = new THREE.Group();
        const topY = 4.5;
        for (const o of [top, tab, rivet, score]) {
          o.position.y -= topY;
          topPivot.add(o);
        }
        canInner.add(topPivot);
        frags.push({
          pivot: topPivot,
          y: topY,
          order: 4,
          side: -1,
          start: { x: -0.8, y: topY + 6.2, z: 0.8, rx: -0.5, rz: 0.35 },
          hover: { x: 0, y: topY + 0.32, z: 0, rx: 0, rz: 0 },
          driftX: 0,
          driftY: topY + 0.27,
        });
        const basePivot = new THREE.Group();
        const baseY = 0.16;
        base.position.y -= baseY;
        basePivot.add(base);
        canInner.add(basePivot);
        frags.push({
          pivot: basePivot,
          y: baseY,
          order: 4,
          side: 1,
          start: { x: 0.7, y: baseY - 6.2, z: 0.9, rx: 0.45, rz: -0.3 },
          hover: { x: 0, y: baseY - 0.32, z: 0, rx: 0, rz: 0 },
          driftX: 0,
          driftY: baseY - 0.27,
        });

        // S1 field lines: 2 × 20 red hairlines that converge onto the can's edges.
        lines = [];
        const lineGeo = new THREE.BoxGeometry(1, 1, 1);
        for (let k = 0; k < 20; k++)
          for (const side of [-1, 1]) {
            const mesh = new THREE.Mesh(
              lineGeo,
              new THREE.MeshBasicMaterial({
                color: new THREE.Color(PAL.red).multiplyScalar(1.6),
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
              }),
            );
            scene.add(mesh);
            lines.push({ mesh, k, side, d: 0.22 + k * 0.3 });
          }

        // --- liquid ribbon (S3) ---
        const matLiquid = new THREE.MeshPhysicalMaterial({
          color: "#5c0a1c",
          roughness: 0.07,
          metalness: 0,
          clearcoat: 1,
          clearcoatRoughness: 0.03,
          envMapIntensity: 2.0,
          emissive: "#4a0714",
          emissiveIntensity: 0.9,
          ior: 1.4,
        });
        liquid = buildLiquid(matLiquid);
        drops = [];
        const dropGeo = new THREE.SphereGeometry(1, 40, 28);
        const J = liquid.J;
        const FREEZE = [
          V(-1.42, 2.95, 1.05),
          V(1.42, 2.95, 1.05),
          V(-2.3, 2.15, 0.85),
          V(2.3, 2.15, 0.85),
        ];
        FREEZE.forEach((F, i) => {
          const T = i < 2 ? 0.42 : 0.34; // virtual flight time to the apex
          const d = F.clone().sub(J);
          const mesh = new THREE.Mesh(dropGeo, matLiquid);
          scene.add(mesh);
          drops.push({
            mesh,
            T,
            v: V(d.x / T, (2 * d.y) / T, d.z / T),
            g: (2 * d.y) / (T * T),
            F,
            ringY: i < 2 ? HAIR_TOP : HAIR_BOT,
          });
        });

        // --- S4 rings: drops become rings that lock onto the printed hairlines ---
        rings = drops.map(() => {
          const mesh = new THREE.Mesh(
            ringGeometry(220, 10),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(PAL.red).multiplyScalar(1.15), transparent: true }),
          );
          scene.add(mesh);
          return mesh;
        });

        // --- cherries ---
        const matCherry = new THREE.MeshPhysicalMaterial({
          color: "#700b21",
          roughness: 0.2,
          clearcoat: 1,
          clearcoatRoughness: 0.05,
          envMapIntensity: 1.25,
          emissive: "#2c040c",
          emissiveIntensity: 0.5,
        });
        const matStem = new THREE.MeshStandardMaterial({ color: PAL.alu, metalness: 0.9, roughness: 0.32 });
        const cherryBody = new THREE.LatheGeometry(
          [
            [0.0, -0.86],
            [0.18, -0.85],
            [0.42, -0.78],
            [0.66, -0.62],
            [0.86, -0.36],
            [0.97, -0.06],
            [0.99, 0.18],
            [0.93, 0.44],
            [0.78, 0.66],
            [0.56, 0.8],
            [0.32, 0.84],
            [0.16, 0.8],
            [0.06, 0.72],
            [0.0, 0.7],
          ].map(([r, y]) => new THREE.Vector2(r, y)),
          64,
        );
        const stemGeo = new THREE.TubeGeometry(
          new THREE.CatmullRomCurve3([V(0, 0.7, 0), V(0.05, 1.2, 0.02), V(0.2, 1.75, 0), V(0.44, 2.15, -0.02)]),
          28,
          0.055,
          8,
        );
        const makeCherry = () => {
          const g = new THREE.Group();
          const inner = new THREE.Group();
          inner.add(new THREE.Mesh(cherryBody, matCherry));
          inner.add(new THREE.Mesh(stemGeo, matStem));
          inner.scale.setScalar(0.4);
          g.add(inner);
          scene.add(g);
          return g;
        };
        const CH = [
          { rest: V(-1.8, 3.95, 0.55), start: V(-5.0, 8.5, 3.0), c1: V(-5.4, 5.8, 2.0), arrive: V(-0.66, 0.88, 0.22), rot: [0.32, 0.5, 0.3], spin: 1 },
          { rest: V(1.85, 3.3, -0.8), start: V(6.5, 6.5, -3.0), c1: V(6.2, 3.2, -2.4), arrive: V(0.9, 0.7, -0.2), rot: [-0.3, -0.9, -0.28], spin: -1 },
          { rest: V(-2.05, 1.55, -0.55), start: V(-7.0, 0.2, -3.0), c1: V(-5.5, 3.6, -2.0), arrive: V(-0.9, 0.8, -0.2), rot: [0.15, 2.1, 0.22], spin: 1 },
          { rest: V(1.9, 1.05, 0.95), start: V(5.0, -4.5, 3.0), c1: V(5.6, -0.8, 2.4), arrive: V(0.9, 0.6, 0.3), rot: [-0.45, 0.4, -0.32], spin: -1 },
          { rest: V(-1.05, 0.3, 1.75), start: V(-4.5, -5.0, 4.0), c1: V(-4.6, -1.0, 3.4), arrive: V(-0.8, 0.7, 0.3), rot: [0.25, -1.3, 0.18], spin: 1 },
        ];
        cherries = CH.map((c, i) => ({ ...c, c2: c.rest.clone().add(c.arrive), t0: 6.52 + 0.18 * i, group: makeCherry() }));
        cherryFG = makeCherry();

        // --- S5 → S6 red disc (camera-facing, grows from the foreground cherry) ---
        disc = new THREE.Mesh(
          new THREE.CircleGeometry(1, 96),
          new THREE.MeshBasicMaterial({ color: invNeutral(PAL.wipe) }),
        );
        scene.add(disc);

        // --- S6 drip, ripples, rebound ---
        drip = new THREE.Mesh(dropGeo, matLiquid);
        scene.add(drip);
        ripples = [0.45, 0.75, 1.05].map((Rmax) => {
          const mesh = new THREE.Mesh(
            ringGeometry(200, 8),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(PAL.red).multiplyScalar(1.1), transparent: true, depthWrite: false }),
          );
          mesh.rotation.x = -Math.PI / 2;
          mesh.userData.Rmax = Rmax;
          scene.add(mesh);
          return mesh;
        });
        rebound = new THREE.Mesh(dropGeo, matLiquid);
        scene.add(rebound);

        // Surface height for the last drop: the ripple sits at screen y ≈ 1700 in the packshot.
        applyCamera(camState(9.8));
        let lo = -8;
        let hi = 0;
        for (let i = 0; i < 40; i++) {
          const mid = (lo + hi) / 2;
          const sy = (1 - (V(0, mid, 0.8).project(camera).y + 1) / 2) * H;
          if (sy > 1700) lo = mid;
          else hi = mid;
        }
        YS = (lo + hi) / 2;

        renderer.compile(scene, camera);
        ready = true;
        renderAt(window.__hfThreeTime != null ? window.__hfThreeTime : pendingTime, true);
      }

      // ---------- liquid: procedural tube along an entry bezier + a ring around the can ----------
      function buildLiquid(mat) {
        const JY = 1.36;
        const RR = 1.4;
        const J = V(0, JY, RR);
        const B = [V(-3.9, -2.4, 4.0), V(-3.3, 1.9, 3.3), V(-1.35, JY, RR + 0.02), J];
        const N = 900;
        const pts = [];
        const cum = [0];
        for (let i = 0; i <= N; i++) {
          pts.push(bezier(B[0], B[1], B[2], B[3], i / N));
          if (i) cum.push(cum[i - 1] + pts[i].distanceTo(pts[i - 1]));
        }
        const LE = cum[N];
        const LR = 2 * Math.PI * RR;
        const M = 420;
        const NR = 20;
        const geo = new THREE.BufferGeometry();
        const nv = (M + 1) * (NR + 1);
        geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(nv * 3), 3));
        geo.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(nv * 3), 3));
        const idx = [];
        for (let i = 0; i < M; i++)
          for (let j = 0; j < NR; j++) {
            const a = i * (NR + 1) + j;
            const b = (i + 1) * (NR + 1) + j;
            idx.push(a, b, a + 1, b, b + 1, a + 1);
          }
        geo.setIndex(idx);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.frustumCulled = false;
        scene.add(mesh);
        const capGeo = new THREE.SphereGeometry(1, 32, 20);
        const head = new THREE.Mesh(capGeo, mat);
        const tail = new THREE.Mesh(capGeo, mat);
        scene.add(head, tail);

        // Position + tangent at arc length s (entry bezier, then the ring of radius rr).
        const at = (s, rr) => {
          if (s <= LE) {
            let lo = 0;
            let hi = N;
            while (hi - lo > 1) {
              const mid = (lo + hi) >> 1;
              if (cum[mid] < s) lo = mid;
              else hi = mid;
            }
            const f = (s - cum[lo]) / Math.max(1e-9, cum[hi] - cum[lo]);
            const p = pts[lo].clone().lerp(pts[hi], clamp01(f));
            const tng = pts[hi].clone().sub(pts[lo]).normalize();
            return { p, tng };
          }
          const a = (s - LE) / RR;
          return { p: V(rr * Math.sin(a), JY, rr * Math.cos(a)), tng: V(Math.cos(a), 0, -Math.sin(a)) };
        };
        return { mesh, head, tail, at, LE, LR, M, NR, J, JY, RR };
      }

      const UP = V(0, 1, 0);
      // Liquid time freezes with the drops (4.50 → 5.08) so the whole world holds its breath.
      const liquidTime = (t) => (t < 4.5 ? t : t < 5.08 ? 4.5 : t - 0.58);

      function updateLiquid(t) {
        const L = liquid;
        const visible = t >= CUT_S3 && t < 5.3;
        L.mesh.visible = L.head.visible = L.tail.visible = visible;
        if (!visible) return;
        const closeK = ez("power2.inOut")(prog(t, 3.42, 4.15)) >= 1 ? 1 : smooth(3.9, 4.15, t);
        const sh = (L.LE + L.LR) * ez("power2.inOut")(prog(t, 3.18, 4.15));
        const st = L.LE * ez("power2.inOut")(prog(t, 3.42, 4.15));
        const absorb = ez("power2.in")(prog(t, 5.08, 5.26));
        const rr = lerp(L.RR, 1.0, absorb);
        const r0 = 0.125 * (1 - absorb);
        const tau = liquidTime(t);
        const splash = 0.38 * bell(t, 4.1, 4.42);
        const pos = L.mesh.geometry.attributes.position.array;
        const nor = L.mesh.geometry.attributes.normal.array;
        let k = 0;
        let rHead = r0;
        let rTail = r0;
        for (let i = 0; i <= L.M; i++) {
          const u = i / L.M;
          const s = lerp(st, sh, u);
          const { p, tng } = L.at(s, rr);
          const nrm = new THREE.Vector3().crossVectors(tng, UP);
          if (nrm.lengthSq() < 1e-6) nrm.set(1, 0, 0);
          nrm.normalize();
          const bin = new THREE.Vector3().crossVectors(nrm, tng).normalize();
          let r = r0 * (1 + 0.09 * Math.sin(s * 5.2 - tau * 7.0) + 0.04 * Math.sin(s * 11.3 + tau * 4.1));
          r *= lerp(smooth(0, 0.1, u), 1, closeK); // tapered tail until the ring closes
          r *= 1 + 0.24 * Math.exp(-(((1 - u) / 0.035) ** 2)) * (1 - closeK); // heavier leading bulb
          const dj = Math.min(Math.abs(s - L.LE), Math.abs(L.LE + L.LR - s));
          r *= 1 + splash * Math.exp(-((dj / 0.22) ** 2));
          if (i === 0) rTail = r;
          if (i === L.M) rHead = r;
          for (let j = 0; j <= L.NR; j++) {
            const b = (j / L.NR) * Math.PI * 2;
            const nx = nrm.x * Math.cos(b) + bin.x * Math.sin(b);
            const ny = nrm.y * Math.cos(b) + bin.y * Math.sin(b);
            const nz = nrm.z * Math.cos(b) + bin.z * Math.sin(b);
            pos[k] = p.x + nx * r;
            pos[k + 1] = p.y + ny * r;
            pos[k + 2] = p.z + nz * r;
            nor[k] = nx;
            nor[k + 1] = ny;
            nor[k + 2] = nz;
            k += 3;
          }
        }
        L.mesh.geometry.attributes.position.needsUpdate = true;
        L.mesh.geometry.attributes.normal.needsUpdate = true;
        const open = closeK < 1;
        L.head.visible = L.tail.visible = open;
        if (open) {
          L.head.position.copy(L.at(sh, rr).p);
          L.head.scale.setScalar(rHead);
          L.tail.position.copy(L.at(st, rr).p);
          L.tail.scale.setScalar(Math.max(rTail, 0.0001));
        }
      }

      // ---------- camera ----------
      function camState(t) {
        let s = 1;
        let az = 0;
        let el = 0.1;
        let ty = YC;
        let fov = FOV0;
        if (t < 1.5) {
          const p = ez("power3.in")(prog(t, 0, 1.5));
          s = lerp(0.8, 1.0, p);
          az = lerp(-0.24, 0, p);
          el = lerp(0.17, 0.1, p);
        } else if (t < CUT_S3) {
          // S2: locked-off camera — the rotation is the only motion.
        } else if (t < 4.5) {
          const p = ez("sine.inOut")(prog(t, CUT_S3, 4.5));
          s = lerp(0.84, 0.88, p);
          az = lerp(0.12, 0.05, p);
          el = lerp(0.21, 0.19, p);
          ty = YC - 0.35;
        } else if (t < 6.5) {
          const rel = ez("power2.inOut")(prog(t, 5.08, 5.9));
          s = t < 5.08 ? tw(t, 4.5, 5.06, 0.88, 0.905, "power1.in") : tw(t, 5.08, 5.5, 0.905, 0.88, "expo.out");
          fov = t < 5.08 ? tw(t, 4.62, 5.06, FOV0, 32, "power2.in") : tw(t, 5.08, 5.45, 32, FOV0, "power4.out");
          az = lerp(0.05, 0, rel);
          el = lerp(0.19, 0.11, rel);
          ty = lerp(YC - 0.35, YC, rel);
        } else if (t < CUT_S6) {
          const p = ez("sine.inOut")(prog(t, 6.5, 7.9));
          s = lerp(0.88, 0.8, p);
          az = lerp(0, -0.14, p);
          el = lerp(0.11, 0.14, p);
        } else {
          s = tw(t, CUT_S6, 9.5, 0.82, 0.8, "power2.out");
          ty = YC - 1.22;
        }
        return { s, az, el, ty, fov };
      }
      function applyCamera(c) {
        const k = Math.tan(THREE.MathUtils.degToRad(FOV0 / 2)) / Math.tan(THREE.MathUtils.degToRad(c.fov / 2));
        const D = (D0 / c.s) * k; // dolly compensates the FOV (S4 perspective contraction)
        camera.fov = c.fov;
        camera.updateProjectionMatrix();
        camera.position.set(Math.sin(c.az) * Math.cos(c.el) * D, c.ty + Math.sin(c.el) * D, Math.cos(c.az) * Math.cos(c.el) * D);
        camera.lookAt(0, c.ty, 0);
        camera.updateMatrixWorld();
      }

      // ---------- per-beat state ----------
      function phiAt(t) {
        if (t < 1.5) return 0;
        if (t < 2.82) return tw(t, 1.5, 2.82, Math.PI * 2, -0.035, "power3.out");
        if (t < 3.0) return tw(t, 2.82, 3.0, -0.035, 0, "sine.inOut");
        if (t < CUT_S6) return 0;
        return tw(t, CUT_S6, 9.5, 0.42, 0, "power3.out");
      }
      function canPose(t) {
        let tilt = 0;
        let sy = 1;
        let sxz = 1;
        if (t >= 4.62 && t < CUT_S6) {
          const k = ez("power2.in")(prog(t, 4.62, 5.06)) * (1 - ez("power4.out")(prog(t, 5.08, 5.42)));
          tilt = -0.16 * k;
          sy = 1 - 0.065 * k;
          sxz = 1 + 0.03 * k;
        } else if (t >= CUT_S6) {
          sy = sxz = tw(t, CUT_S6, 9.4, 1.035, 1, "power2.out");
        }
        return { tilt, sy, sxz };
      }
      const xClipAt = (t) => (t < 1.5 ? -50 : tw(t, 1.62, 2.62, -1.15, 1.15, "sine.inOut"));
      function glowAt(t) {
        if (t < 1.5) return 0.24 * ez("power2.in")(prog(t, 0.2, 1.5));
        if (t < CUT_S3) return 0.24 + 0.26 * (1 - ez("power2.out")(prog(t, 1.5, 2.1)));
        if (t < 5.08) return 0.15;
        if (t < 6.5) return 0.26 + 0.45 * (1 - ez("power2.out")(prog(t, 5.08, 5.8)));
        if (t < CUT_S6) return 0.26;
        return 0.3;
      }
      function canEnvAt(t) {
        if (t < 1.5) return 0.8 + 0.2 * prog(t, 0.3, 1.5);
        if (t < CUT_S3) return 1.0 + 0.5 * (1 - ez("power2.out")(prog(t, 1.5, 1.85)));
        if (t < 4.5) return 0.55;
        if (t < 5.08) return tw(t, 4.5, 4.7, 0.55, 0.45, "sine.inOut");
        if (t < CUT_S6) return 1.0 + 0.7 * (1 - ez("power2.out")(prog(t, 5.08, 5.7)));
        return 1.05;
      }
      function labelEmAt(t) {
        if (t < CUT_S3) return 0.32;
        if (t < 5.08) return 0.1;
        if (t < CUT_S6) return 0.38 + 0.7 * (1 - ez("power2.out")(prog(t, 5.08, 5.7)));
        return 0.42;
      }
      function rimAt(t) {
        if (t < 1.5) {
          const P = ez("power2.in")(prog(t, 0.25, 1.5));
          return 0.05 + 1.3 * P * P * P;
        }
        if (t < CUT_S3) return lerp(1.35, 0.28, ez("power2.out")(prog(t, 1.5, 2.2))) + 0.9 * smooth(2.9, 3.15, t);
        if (t < 5.08) return 0.65;
        if (t < CUT_S6) return lerp(1.5, 0.32, ez("power2.out")(prog(t, 5.08, 5.8)));
        return 0.3;
      }
      const RED_LIN = new THREE.Color(PAL.red);
      const WHITE_LIN = new THREE.Color(PAL.white);
      function bandAt(t) {
        // S2: the red reflection rides the reveal edge across the can.
        if (t >= 1.5 && t < 2.9) {
          const x = clamp01((xClipAt(t) + 1) / 2) * 2 - 1;
          const str = 3.2 * smooth(1.58, 1.72, t) * (1 - smooth(2.55, 2.72, t));
          return { az: 2 * Math.asin(Math.max(-0.995, Math.min(0.995, x))), w: 0.09, col: RED_LIN, str };
        }
        // S2 → S3: the reflection blooms before the sheen takes the frame.
        if (t >= 2.9 && t < CUT_S3) return { az: 0.5, w: lerp(0.1, 0.9, smooth(2.9, 3.15, t)), col: RED_LIN, str: 5 * smooth(2.9, 3.12, t) };
        // S4: white sheen across the logo once the rings have locked.
        if (t >= 5.98 && t < 6.5) return { az: tw(t, 5.98, 6.45, -1.3, 1.3, "power2.inOut"), w: 0.12, col: WHITE_LIN, str: 2.4 * bell(t, 5.98, 6.45) };
        // S6: a last glint as the iris opens.
        if (t >= 8.62 && t < 9.3) return { az: tw(t, 8.62, 9.25, -1.0, 1.0, "power2.inOut"), w: 0.14, col: WHITE_LIN, str: 1.3 * bell(t, 8.62, 9.25) };
        return { az: 0, w: 0.1, col: RED_LIN, str: 0 };
      }

      function applyFragments(t) {
        for (const f of frags) {
          const tS = 0.18 + 0.11 * f.order;
          const tA = tS + 0.44;
          const p1 = ez("power3.out")(prog(t, tS, tA));
          const p2 = ez("sine.inOut")(prog(t, tA, 1.3));
          const p3 = ez("expo.in")(prog(t, 1.3, 1.5));
          const xh = t < tA ? lerp(f.start.x, f.hover.x, p1) : lerp(f.hover.x, f.driftX, p2);
          const yh = t < tA ? lerp(f.start.y, f.hover.y, p1) : lerp(f.hover.y, f.driftY, p2);
          f.pivot.position.set(lerp(xh, 0, p3), lerp(yh, f.y, p3), lerp(f.start.z, f.hover.z, p1) * (1 - p3));
          f.pivot.rotation.set(lerp(f.start.rx, f.hover.rx, p1) * (1 - p3), 0, lerp(lerp(f.start.rz, f.hover.rz, p1), 0, p3));
        }
      }

      function applyLines(t) {
        const P = ez("power2.in")(prog(t, 0.25, 1.5));
        for (const L of lines) {
          const dist = L.d * (1 - P);
          const appear = ez("power3.out")(prog(t, 0.06 + 0.016 * L.k, 0.42 + 0.016 * L.k));
          const h0 = 5.2 * Math.sqrt(Math.max(0.1, 1 - (L.d / 6.6) ** 2));
          const h = lerp(h0, BODY_H, P) * appear;
          const op = 0.9 * clamp01(dist / 0.14) * (0.35 + 0.65 * (1 - L.k / 22));
          L.mesh.visible = t < 1.5 && h > 0.001 && op > 0.002;
          if (!L.mesh.visible) continue;
          L.mesh.position.set(L.side * (1.008 + dist), lerp(YC, BODY_Y0 + BODY_H / 2, P), 0);
          L.mesh.scale.set(0.011, h, 0.011);
          L.mesh.material.opacity = op;
        }
      }

      const _q = new THREE.Quaternion();
      const HORIZ = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
      function applyDropsAndRings(t) {
        drops.forEach((d, i) => {
          const vis = t >= 4.15 && t < 5.2;
          d.mesh.visible = vis;
          if (vis) {
            const u = prog(t, 4.15, 4.5);
            const s = d.T * ez("power2.out")(u);
            const p = liquid.J.clone().addScaledVector(d.v, s);
            p.y -= 0.5 * d.g * s * s;
            const dsdt = (d.T * 2 * (1 - u)) / 0.35;
            const vel = V(d.v.x, d.v.y - d.g * s, d.v.z).multiplyScalar(dsdt);
            const speed = vel.length();
            const stretch = 1 + Math.min(0.9, speed * 0.06);
            const grow = lerp(0.4, 1, ez("power2.out")(prog(t, 4.15, 4.24)));
            const shrink = 1 - ez("power2.in")(prog(t, 5.08, 5.2));
            const r = 0.12 * grow * shrink;
            d.mesh.position.copy(p);
            if (speed > 1e-4) d.mesh.quaternion.setFromUnitVectors(UP, vel.normalize());
            d.mesh.scale.set(r / Math.sqrt(stretch), r * stretch, r / Math.sqrt(stretch));
          }
          const ring = rings[i];
          ring.visible = t >= 5.1 && t < 6.78;
          if (!ring.visible) return;
          const pc = ez("power3.inOut")(prog(t, 5.26, 5.92));
          const R = t < 5.26 ? 0.17 * ez("expo.out")(prog(t, 5.1, 5.26)) : lerp(0.17, 1.013, pc);
          setRing(ring.geometry, Math.max(R, 0.001), 0.0115);
          ring.position.copy(d.F).lerp(V(0, d.ringY, 0), pc);
          _q.copy(camera.quaternion).slerp(HORIZ, pc);
          ring.quaternion.copy(_q);
          const hot = bell(t, 5.92, 6.2);
          ring.material.color.copy(RED_LIN).multiplyScalar(1.15).lerp(new THREE.Color(PAL.white).multiplyScalar(1.6), hot);
          ring.material.opacity = 1 - ez("power1.inOut")(prog(t, 6.45, 6.75));
        });
      }

      function applyCherries(t) {
        cherries.forEach((c, i) => {
          const g = c.group;
          g.visible = t >= c.t0 && t < CUT_S6;
          if (!g.visible) return;
          const tLand = c.t0 + 0.58;
          const p = ez("power3.out")(prog(t, c.t0, tLand));
          g.position.copy(bezier(c.start, c.c1, c.c2, c.rest, p));
          g.rotation.set(c.rot[0] + 1.1 * (1 - p), c.rot[1] + c.spin * Math.PI * 3 * (1 - p), c.rot[2]);
          g.scale.setScalar(1 + 0.07 * (1 - ez("power2.out")(prog(t, tLand, tLand + 0.18))) * (t >= tLand ? 1 : 0));
        });

        // Foreground pass: a cherry crosses close to the lens (camera space) and seeds the red disc.
        const fgVis = t >= 7.92 && t < CUT_S6;
        cherryFG.visible = fgVis;
        disc.visible = fgVis && t >= 8.1;
        if (!fgVis) return;
        const p = ez("sine.inOut")(prog(t, 7.92, 8.46));
        const local = bezier(V(0.95, -1.75, -5.2), V(0.45, -0.6, -4.6), V(-0.2, 0.3, -4.4), V(-0.95, 1.75, -5.2), p);
        cherryFG.position.copy(camera.localToWorld(local.clone()));
        cherryFG.quaternion.copy(camera.quaternion);
        cherryFG.rotateY(1.6 * p);
        cherryFG.rotateZ(0.35 - 0.5 * p);
        if (disc.visible) {
          const depth = 6.0; // behind the passing cherry (4.4–5.2), in front of everything else
          const k = depth / -local.z;
          disc.position.copy(camera.localToWorld(V(local.x * k, local.y * k, -depth)));
          disc.quaternion.copy(camera.quaternion);
          disc.scale.setScalar(Math.max(0.0001, 4.6 * ez("power2.in")(prog(t, 8.1, 8.43))));
        }
      }

      function applyPackshotDrop(t) {
        const y0 = -0.125;
        const G = (2 * (y0 - YS)) / (0.28 * 0.28);
        drip.visible = t >= 8.92 && t < 9.4;
        if (drip.visible) {
          if (t < 9.12) {
            const r = 0.085 * ez("power2.out")(prog(t, 8.92, 9.12));
            const el = 1 + 0.35 * smooth(9.0, 9.12, t);
            drip.position.set(0, -0.01 - r * el, 0.8);
            drip.scale.set(r, Math.max(1e-4, r * el), r);
          } else {
            const dt = t - 9.12;
            drip.position.set(0, y0 - 0.5 * G * dt * dt, 0.8);
            drip.scale.set(0.075, 0.125, 0.075);
          }
          drip.quaternion.identity();
        }
        ripples.forEach((m, i) => {
          const a = 9.4 + 0.06 * i;
          const u = prog(t, a, a + 0.38);
          m.visible = t >= a && u < 1;
          if (!m.visible) return;
          setRing(m.geometry, Math.max(0.001, m.userData.Rmax * ez("expo.out")(u)), 0.011);
          m.position.set(0, YS, 0.8);
          m.material.opacity = 0.85 * Math.pow(1 - u, 1.5);
        });
        rebound.visible = t >= 9.4 && t < 9.6;
        if (rebound.visible) {
          const u = prog(t, 9.4, 9.6);
          rebound.position.set(0, YS + 0.3 * (1 - (2 * u - 1) ** 2), 0.8);
          rebound.scale.setScalar(0.036 * (1 - 0.4 * u));
        }
      }

      function applyState(t) {
        applyCamera(camState(t));

        const pose = canPose(t);
        canGroup.rotation.set(pose.tilt, phiAt(t), 0);
        canGroup.scale.set(pose.sxz, pose.sy, pose.sxz);
        labelMesh.visible = t >= 1.5;

        applyFragments(t);
        const xc = xClipAt(t);
        clipPlane.constant = -xc;
        for (let k = 0; k < 7; k++) frags[k].pivot.visible = t < 2.64;

        applyLines(t);

        const env = canEnvAt(t);
        matLabel.envMapIntensity = env;
        matShell.envMapIntensity = env;
        matAlu.envMapIntensity = env;
        matLabel.emissiveIntensity = labelEmAt(t);
        U.uRimStr.value = rimAt(t);
        const b = bandAt(t);
        U.uBandAz.value = b.az;
        U.uBandW.value = b.w;
        U.uBandCol.value.copy(b.col);
        U.uBandStr.value = b.str;
        glowPlane.material.color.setScalar(glowAt(t));

        updateLiquid(t);
        applyDropsAndRings(t);
        applyCherries(t);
        applyPackshotDrop(t);
      }

      // Shutter blur on the fast beats only: sub-frames over half a frame, averaged in linear light.
      function samplesAt(t) {
        if (t >= 1.5 && t < 2.45) return 6;
        if (t >= 1.36 && t < 1.5) return 4;
        if (t >= 8.0 && t < 8.42) return 16; // fast foreground pass: dense, short shutter so the stem smears without the body going translucent
        if (t >= 7.92 && t < 8.46) return 12;
        return 1;
      }
      const SHUTTER = 0.5 / 30;
      // Sub-frames never reach back across a hard beat (the 1.50 lock, the two hidden cuts).
      const shutterAt = (t) => (t >= 7.92 && t < 8.46 ? 0.22 / 30 : SHUTTER);
      const blurFloor = (t) => (t >= CUT_S6 ? CUT_S6 : t >= CUT_S3 ? CUT_S3 : t >= 1.5 ? 1.5 : 0);

      function renderAt(t, force = false) {
        if (!ready) {
          pendingTime = t;
          return;
        }
        if (!force && t === lastTime) return;
        lastTime = t;
        const n = samplesAt(t);
        for (let i = 0; i < n; i++) {
          const ti = n === 1 ? t : Math.max(blurFloor(t), t - shutterAt(t) * (i / (n - 1)));
          applyState(ti);
          renderer.setRenderTarget(rtSub);
          renderer.clear();
          renderer.render(scene, camera);
          accMat.blendAlpha = 1 / (i + 1);
          renderer.setRenderTarget(rtAcc);
          renderer.render(accScene, quadCam);
        }
        renderer.setRenderTarget(null);
        renderer.render(copyScene, quadCam);
      }

      build().then(resolveBuild, (err) => {
        console.error("[drft] scene build failed", err);
        resolveBuild();
      });
    </script>
  </body>
</html>
